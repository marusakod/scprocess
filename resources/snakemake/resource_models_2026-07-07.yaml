# Fitted resource models: memory (MB) and time (seconds) predicted as
#   intercept + slope * x, where x is given by model_var for each rule.
# Hierarchy: rules > rule name > memory / time > chemistry group > fields.
# Chemistry groups: all (same for every chemistry), 3v3, 3v4, flex, other.
# 'other' covers every chemistry that is not 3v3, 3v4 or flex (5v1, 5v2, 5v3, multiome, ...)
# and uses the 3v3 values. 'flex' (flexv1, flexv2) is PROVISIONAL: twice the 3v3 intercept
# and slope, until values fitted on Flex data are available. A memory or time model with
# chemistry-specific values lists all four groups. The zoom_* entries repeat the models of
# the project rules they reuse (zoom_aggregate_labels uses the merge_labels model, etc.).
# Source: resources_lm_params_2026-07-07.csv (benchmarks from ~96 projects; the CSV is in
# the git history before this file was added); floors are in
# resource_floors.yaml, which is maintained by hand.
