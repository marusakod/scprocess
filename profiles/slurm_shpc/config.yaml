# General configurations
executor: slurm
latency-wait: 10
show-failed-logs: True
slurm-keep-successful-logs: True
keep-going: True
scheduler: greedy   
printshellcmds: True
jobs: 20
default-resources:
  runtime: 3h
  mem_mb: 4096
set-resources:
  run_integration:
    slurm_partition: "batch_gpu"
    slurm_extra: "'--gpus=1'"
    qos: '3h'
  classify_additional_doublets:
    slurm_partition: "batch_gpu"
    slurm_extra: "'--gpus=1'"
    qos: '3h'
  zoom_run_integration:
    slurm_partition: "batch_gpu"
    slurm_extra: "'--gpus=1'"
    qos: '3h'
  run_cellbender:
    slurm_partition: "batch_gpu"
    slurm_extra: "'--gpus=1 --cpus-per-task=4'"
    # qos: '3h'
    qos: '1d'
    # runtime: 360
  join_integration:
    slurm_partition: "batch_gpu"
    slurm_extra: "'--gpus=1'"
    qos: '3h'
  # GPU requests apply whenever a rule runs. Training entries are commented out
  # because train_xgboost.use_gpu is off by default; uncomment them when it is
  # true. Remove the integration entries if integration.int_use_gpu is false.
  # train_xgboost_train:
  #   slurm_partition: "batch_gpu"
  #   slurm_extra: "'--gpus=1'"
  #   qos: '3h'
  # zoom_train_xgboost_train:
  #   slurm_partition: "batch_gpu"
  #   slurm_extra: "'--gpus=1'"
  #   qos: '3h'
  # join_train_xgboost_train:
  #   slurm_partition: "batch_gpu"
  #   slurm_extra: "'--gpus=1'"
  #   qos: '3h'
