# General configurations
executor: slurm
latency-wait: 10
show-failed-logs: True
keep-going: True
scheduler: greedy   
printshellcmds: True
jobs: 20
default-resources:
  runtime: 3h
  mem_mb: 4096
# Rules that can use a GPU. Integration and doublet classification use it when
# int_use_gpu is true, classifier training when train_xgboost.use_gpu is true,
# and CellBender always. Add your site's GPU partition (slurm_partition) and
# QoS if required; see profiles/slurm_shpc for an example.
set-resources:
  run_integration:
    slurm_extra: "'--gpus=1'"
  classify_additional_doublets:
    slurm_extra: "'--gpus=1'"
  zoom_run_integration:
    slurm_extra: "'--gpus=1'"
  join_integration:
    slurm_extra: "'--gpus=1'"
  run_cellbender:
    slurm_extra: "'--gpus=1'"
  train_xgboost_train:
    slurm_extra: "'--gpus=1'"
  zoom_train_xgboost:
    slurm_extra: "'--gpus=1'"
  join_train_xgboost_train:
    slurm_extra: "'--gpus=1'"
