executor: lsf
latency-wait: 10
show-failed-logs: True
keep-going: True
scheduler: greedy   
printshellcmds: True
jobs: 20
default-resources:
  runtime: 3h
  mem_mb: 4096

# Optional GPU examples. Uncomment and edit for your LSF site.
# Common LSF GPU syntax uses bsub options such as:
#   -gpu "num=1"
# Some sites also require a GPU queue or resource string, e.g.:
#   lsf_queue: gpu
#   lsf_extra: "-gpu 'num=1' -R 'select[gpu]'"
