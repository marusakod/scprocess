  - r-assertthat
  - r-circlize
  - r-data.table
  - r-dplyr
  - r-forcats
  - r-future
  - r-ggbeeswarm
  - r-ggh4x
  - r-ggplot.multistats
  - r-ggplot2
  - r-ggrepel
  - r-ggridges
  - r-glue
  - r-gridextra
  - r-harmony
  - r-kableextra
  - r-magrittr
  - r-matrix
  - r-matrix.utils
  - r-metbrewer
  - r-patchwork
  - r-purrr
  - r-quantreg
  - r-rcolorbrewer
  - r-readxl
  - r-rfast
  - r-rmdformats
  - r-robustbase
  - r-scales
