# Match the validated CUDA-12 / RAPIDS-25.12 / RSC-0.16.1 GPU test stack.
# Direct dependencies only: let Conda resolve compatible transitive packages.
name: rapids_singlecell
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - cuda-version=12.9
  - cudf=25.12
  - cugraph=25.12
  - cuml=25.12
  - cuvs=25.12
  - rmm=25.12
  - cupy
  - scanpy=1.11.4
  - scipy
  - h5py
  - polars
  - python-igraph
  - leidenalg
  - pip
  - pip:
      - harmonypy==0.0.10
      - rapids-singlecell-cu12==0.16.1
